name: Progressive Coach Insights Regression Tests

on:
  pull_request:
    paths:
      - 'lib/insights/**'
      - 'components/insights/**'
      - 'app/coach-insights/**'
      - 'tests/coach-insights*.test.ts'
      - 'tests/tsconfig.json'
      - 'package.json'
      - '.github/workflows/progressive-coach-insights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-insights:
    name: Validate early, preliminary and mixed-format coaching statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: |
          npm install -g pnpm@10.28.0
          pnpm install --frozen-lockfile

      - name: Run all insight and data-isolation regressions
        run: pnpm test:insights
